<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- 화면에 보이는 문구는 전부 web/i18n의 번역 파일에서 가져오므로, 제목도 main.ts가 채운다. -->
    <title></title>
    <!-- 직접 고른 화면 모드(라이트/다크)를 그리기 전에 먼저 적용한다. 본문 스크립트에서 하면 잠깐 반대 색이 번쩍인다.
         키 이름은 theme.ts와 같아야 한다. 저장소가 막혀 있으면 OS 설정을 따른다. -->
    <script>
      try {
        var t = localStorage.getItem("fransis-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- display=swap: 글꼴이 늦어도 글자가 먼저 보이고, 도착하면 바뀐다(앱 안 브라우저에서 빈 화면을 피한다). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
